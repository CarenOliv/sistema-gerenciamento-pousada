{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM-Nova Reserva</title>
</head>
<body>

    <header>
        <div class="logo">
            <img src="{% static 'LogoCM.jpeg'%}" alt="Logo da pousada">
        </div>

            <nav>

                <a href="#">Home</a>
                <a href="#">Hóspedes</a>
                <a href="#">Reservas</a>
                <a href="#">Quartos</a>
                <a href="#">Configurações</a>
                <a href="#">Sair</a>

            </nav>

    </header>

    <main>
        <section>
            <h1>Nova Reserva</h1>
            <p>Cadastre uma nova reserva.</p>
            
            <section class="formulario-card">
                <form method="POST">
                    {% csrf_token %}

                    {{ for.as_p }}

                    <button type="submit">
                        Salvar Reserva
                    </button>
                </form>
            </section>

        </section>
    </main>

    
</body>
</html>
