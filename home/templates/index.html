{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Céu & Mar Pousada</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing: border-box;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background-color: #F5F5F5;
    }

    header{
      background-color: #102B4E;
      height: 90px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding: 0 50px;
      box-shadow: 0 30px 10px rgba(0 ,0, 0, .15);
    }

    #logo img{
      height: 65px;
    }

    nav{
      display:flex;
      gap:30px
    }

    nav a{
      color:white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    /*efeito quando o mouse passar por cima*/
    nav a:hover{
      color:#D9895B
    }

    main{
      padding: 40px;
    }

    #boas-vindas{
      margin-bottom: 40px;
    }

    #boas-vindas h1{
      color:#102B4E;
      margin-bottom: 10px;
    }

    #boas-vindas p{
      color:#555
    }

    #cards{
      display: flex;
      align-items: center;
      justify-content: center;
      gap:30px
    }

    .card{
      background: white;
      width: 220px;
      padding: 30px;
      border-radius:15px;
      text-align:center;
      box-shadow: 0 5px 15px rgba(0,0,0,.08);
    }

    .card h3{
      color:#102B4E;
      margin-bottom: 15px;
    }

    .card span{
      font-size: 35px;
      font-weight: bold;
      color:#D9895B
    }

  </style>

</head>


<body>
  <header>
    
    <div id="logo">
      <img src="{% static 'LogoCM.jpeg'%}" alt="Logo da pousada">
    </div>

    <div>

      <nav>
        <a href="#">Hópedes</a>
        <a href="/reservas/">Reservas</a>

        {% if request.user.is_superuser %}
        <a href="#">Quartos</a>
        <a href="/admin/">Configurações</a>
        {% endif %}

        <a href="{% url 'logout' %}">Sair</a>
      </nav>

    </div>

  </header>

  <main>

    <section id="cards">

      <div class="card">
        <h3>Hóspedes</h3>
        <span>{{total_hospedes}}</span>
      </div>

      <div class="card">
        <h3>Reservas</h3>
        <span>{{total_reservas}}</span>
      </div>

      <div class="card">
        <h3>Quartos</h3>
        <span>{{total_quartos}}</span>
      </div>


    </section>

  </main>

</body>
</html>
