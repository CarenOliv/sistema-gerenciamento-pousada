<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hóspedes - Céu & Mar Pousada</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background-color: #f4f6f8;
    }

    header{
      background-color: #0e3a5d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container{
      width: 90%;
      margin: 30px auto;
    }

    .topo{
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .topo h2{
      color: #0e3a5d;
    }

    .btn{
      background-color: #e58a1f;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover{
      background-color: #c97212;
    }

    table{
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    th{
      background-color: #1d7fa3;
      color: white;
      padding: 15px;
      text-align: left;
    }

    td{
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }

    tr:hover{
      background-color: #f1f1f1;
    }

    .acoes button{
      padding: 7px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      margin-right: 5px;
    }

    .editar{
      background-color: #1d7fa3;
    }

    .excluir{
      background-color: #d9534f;
    }

    footer{
      margin-top: 40px;
      background-color: #0e3a5d;
      color: white;
      text-align: center;
      padding: 15px;
    }

  </style>

</head>

<body>

  <header>
    <h1>Gerenciamento de Hóspedes</h1>
  </header>

  <div class="container">

    <div class="topo">
      <h2>Lista de Hóspedes</h2>

      <button class="btn">
        + Novo Hóspede
      </button>
    </div>

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>CPF</th>
          <th>Telefone</th>
          <th>Email</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody>

        {% comment %} <tr>
          <td>1</td>
          <td>Maria Oliveira</td>
          <td>123.456.789-00</td>
          <td>(87) 99999-1111</td>
          <td>maria@email.com</td>

          <td class="acoes">
            <button class="editar">Editar</button>
            <button class="excluir">Excluir</button>
          </td>
        </tr> {% endcomment %}

          
        

      </tbody>

    </table>

  </div>

  <footer>
    <p>&copy; 2026 Sistema de Gerenciamento de Pousada</p>
  </footer>

</body>
</html>
